<svg xmlns="http://www.w3.org/2000/svg">
<!-- design-kit/icons.svg: 이 키트용으로 직접 그린 24px 라인 아이콘 스프라이트(외부 아이콘 세트를 옮기지 않았다). 선 2px, 끝 둥글게, 색은 currentColor.
     사용: <svg class="ico" aria-hidden="true"><use href="icons.svg#i-search"/></svg> (templates 안에서는 ../icons.svg). 글자 없는 버튼에는 aria-label.
     목록 27: search filter refresh bell alert info check x plus chevron-right chevron-down arrow-left home list grid chart clock calendar user users sliders download upload copy file wafer gauge -->
