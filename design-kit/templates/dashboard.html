<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라인 현황판</title>
<!-- 템플릿 dashboard (제조 모니터링): 상단바 + 툴바 + stat 행(임계값 틴트) + 패널 그리드 + 표 + 알림. 큰 제목·리드 문장 없음.
 1280 +----------------------------------------------------------------------+
      | [B] 라인 현황판  FAB-1 B라인                기준 09:00  [새로고침]     |  topbar
      | [검색________] [공정 v] (칩 x)                    [전체 20|주의 6]     |  toolbar
      | [배너: 실데이터 / 내장 샘플 / 불러오기 실패]                             |
      | [수율 94.2%] [가동률 87.5%] [WIP 1,284] [알람 7]  warn/bad 는 면 틴트   |  stats
      | [설비 상태 보드 span-8                 ] [알림 span-4: 심각도 띠+확인] |  panels
      | [SPC 추세 span-6: UCL/LCL 점선, 이탈 점] [공정별 가동률 span-6: 축+값] |
      | [로트 표 span-12: sticky 헤더, 36px 행, 숫자 우정렬, 홀드 행 틴트]      |
  834: 상단바 > 툴바 > stat 1줄 > 설비 전폭 > 알림 반폭 > 차트 2열 > 표(키트 CSS 기본)
  390: 상단바 > 검색 1줄 > stat 2열 > 알림 > 설비 > 차트 > 표(가로 스크롤은 표 안에서만)
  매핑: data.json 의 kpi / equipment / alarms / spc / lots. 과제에 맞게 아래 TH(임계값)·EQ·LOT·SEV 표와 render 함수만 바꾼다. -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components.css">
<style>
  .alarm .msg .id { margin-right: 4px; }
  .alarm .when { display: block; }
  .eq .st { display: flex; justify-content: space-between; gap: 4px; }
  td .empty { border: 0; white-space: normal; }
  @media (max-width: 640px) { .panels > .p-alarm { order: -1; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <div class="ident">
      <div class="logo" aria-hidden="true">B</div>
      <div class="brand-text"><b>라인 현황판</b><small id="line-name">-</small></div>
    </div>
    <div class="actions">
      <span class="meta" id="asof">기준 -</span>
      <button class="btn sm" type="button" id="reload"><svg class="ico sm" aria-hidden="true"><use href="../icons.svg#i-refresh"/></svg>새로고침</button>
    </div>
  </div>
</header>
<main class="container">
  <div class="page-head">
    <h1>라인 현황</h1>
    <span class="meta" id="shift">-</span>
  </div>
  <div class="toolbar" role="search">
    <label class="sr-only" for="q">설비, 로트, 제품 검색</label>
    <input class="input search" id="q" type="search" placeholder="설비 ID, 로트, 제품">
    <label class="sr-only" for="f-step">공정</label>
    <select id="f-step"><option value="">공정 전체</option></select>
    <div class="chips" id="chips" hidden></div>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="보기">
      <button type="button" data-view="all" aria-pressed="true">전체 <span class="n" id="n-all">0</span></button>
      <button type="button" data-view="watch" aria-pressed="false">주의만 <span class="n" id="n-watch">0</span></button>
    </div>
  </div>
  <div class="banner" id="status" hidden></div>

  <section class="section" aria-labelledby="h-kpi">
    <h2 class="sr-only" id="h-kpi">핵심 지표</h2>
    <div class="stats" id="stats"></div>
  </section>

  <div class="panels section">
    <section class="panel span-8" aria-labelledby="h-eq">
      <div class="panel-head"><h2 id="h-eq">설비 상태</h2><div class="legend" id="legend"></div></div>
      <div class="panel-body"><div class="eq-board" id="eq"></div></div>
    </section>
    <section class="panel span-4 p-alarm" aria-labelledby="h-alarm">
      <div class="panel-head"><h2 id="h-alarm">알림</h2><span class="meta" id="alarm-count">-</span></div>
      <div class="panel-body"><div class="alarm-list" id="alarms"></div></div>
    </section>
    <section class="panel span-6" aria-labelledby="h-spc">
      <div class="panel-head"><h2 id="h-spc">SPC 추세</h2><span class="meta" id="spc-meta"></span></div>
      <div class="panel-body" id="spc"></div>
    </section>
    <section class="panel span-6" aria-labelledby="h-util">
      <div class="panel-head"><h2 id="h-util">공정별 가동률</h2><span class="meta">목표선 85%</span></div>
      <div class="panel-body" id="util"></div>
    </section>
    <section class="panel" aria-labelledby="h-lot">
      <div class="panel-head"><h2 id="h-lot">로트</h2><span class="meta" id="lot-count">-</span></div>
      <div class="panel-body tight">
        <div class="table-wrap">
          <table>
            <thead><tr><th>로트</th><th>제품</th><th>공정</th><th>설비</th><th class="num">수량(매)</th><th class="num">시작</th><th>상태</th><th>홀드 사유</th></tr></thead>
            <tbody id="lots"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
  <p class="meta section" id="note"></p>
</main>

<script src="../kit.js"></script>
<script>
(function () {
  'use strict';
  // 임계값(low: 낮을수록 나쁨). 경계는 과제 README 또는 담당자 답으로 바꾸고 DECISIONS 1 에 근거를 적는다
  var TH = { yield: { warn: 93, bad: 90, low: true }, oee: { warn: 88, bad: 80, low: true }, alarms: { warn: 5, bad: 10 } };
  var DIR = { yield: 1, oee: 1, alarms: -1 };   // delta 색: 1 = 오르면 개선, -1 = 내리면 개선, 없음 = 중립
  var EQ = { RUN: ['가동', 'ok'], IDLE: ['대기', 'info'], PM: ['예방보전', 'warn'], DOWN: ['고장', 'bad'], OFF: ['비가동', 'off'] };
  var LOT = { RUN: ['진행', 'ok'], WAIT: ['대기', 'info'], HOLD: ['홀드', 'bad'], DONE: ['완료', 'off'] };
  var SEV = { Critical: ['긴급', 'bad'], Major: ['주의', 'warn'], Minor: ['정보', 'info'] };
  var SAMPLE = {   // 내장 샘플: data.json 을 못 읽을 때만 쓰고 배너로 알린다
    meta: { line: '샘플 라인', asof: '2026-01-01T09:00', shift: '샘플 교대', note: '내장 샘플이며 실데이터가 아니다.' },
    kpi: [{ key: 'yield', label: '수율', value: 92.0, unit: '%', delta: 0, delta_label: '전일 대비', series: [92, 91.5, 92] }],
    equipment: [{ id: 'EQ-01', name: '샘플 설비', step: 'STEP', state: 'RUN', util: 80, note: '' }],
    lots: [], alarms: [],
    spc: { param: '샘플 값', unit: 'nm', target: 50, ucl: 52, lcl: 48, points: [50, 51, 49.5], labels: ['1', '2', '3'] }
  };
  var $ = function (id) { return document.getElementById(id); };
  var D = null, view = 'all';

  function empty(title, hint) { return '<div class="empty"><b>' + K.esc(title) + '</b>' + K.esc(hint || '') + '</div>'; }
  function level(key, v) {
    var t = TH[key];
    if (!t) return '';
    if (t.low) return v < t.bad ? 'bad' : (v < t.warn ? 'warn' : '');
    return v >= t.bad ? 'bad' : (v >= t.warn ? 'warn' : '');
  }
  function match(o) {
    var q = $('q').value.trim().toLowerCase(), st = $('f-step').value;
    if (st && o.step !== st) return false;
    return !q || JSON.stringify(o).toLowerCase().indexOf(q) >= 0;
  }
  function renderStats() {
    $('stats').innerHTML = D.kpi.map(function (k) {
      var dg = k.unit === '%' ? 1 : 0, dl = k.delta || 0, dir = DIR[k.key] || 0;
      var cls = (!dl || !dir) ? '' : (dl * dir > 0 ? 'up' : 'down');
      return '<div class="stat" data-level="' + level(k.key, k.value) + '"><span class="label">' + K.esc(k.label) + '</span>' +
        '<span class="value">' + K.fmt(k.value, dg) + '<small>' + K.esc(k.unit) + '</small></span>' +
        '<span class="delta ' + cls + '">' + K.esc(k.delta_label || '') + ' ' + (dl > 0 ? '+' : '') + K.fmt(dl, dg) + '</span>' +
        K.spark(k.series || [], { label: k.label + ' 추세' }) + '</div>';
    }).join('') || empty('지표가 없습니다', 'kpi 배열이 비어 있습니다.');
  }
  function renderAlarms() {
    var open = D.alarms.filter(function (a) { return !a.ack; }).length;
    $('alarm-count').textContent = '미확인 ' + open + '건';
    $('alarms').innerHTML = D.alarms.map(function (a, i) {
      var s = SEV[a.sev] || [a.sev, 'info'];
      return '<div class="alarm' + (a.ack ? ' acked' : '') + '"><span class="sev ' + s[1] + '"></span>' + K.badge(s[0], s[1]) +
        '<span class="msg"><span class="id">' + K.esc(a.eqp) + '</span>' + K.esc(a.msg) + '<span class="when">' + K.hhmm(a.at) +
        (a.ack ? ' 발생, ' + K.esc(a.ack_by || '') + ' ' + K.hhmm(a.ack_at) + ' 확인' : ' 발생') + '</span></span>' +
        (a.ack ? '' : '<button class="btn sm" type="button" data-ack="' + i + '">확인</button>') + '</div>';
    }).join('') || empty('새 알림이 없습니다', '알림이 생기면 최신순으로 여기에 쌓입니다.');
  }
  function render() {
    var eqAll = D.equipment.filter(match), lotAll = D.lots.filter(match);
    var eqW = eqAll.filter(function (e) { return e.state !== 'RUN' && e.state !== 'OFF'; });
    var lotW = lotAll.filter(function (l) { return l.state === 'HOLD' || l.state === 'WAIT'; });
    var eqs = view === 'watch' ? eqW : eqAll, lots = view === 'watch' ? lotW : lotAll;
    $('n-all').textContent = eqAll.length + lotAll.length;
    $('n-watch').textContent = eqW.length + lotW.length;
    var chips = [];
    if ($('q').value.trim()) chips.push(['q', '검색: ' + $('q').value.trim()]);
    if ($('f-step').value) chips.push(['step', '공정: ' + $('f-step').value]);
    K.chips($('chips'), chips, function (key) { if (key === 'q') $('q').value = ''; else $('f-step').value = ''; render(); });
    $('legend').innerHTML = Object.keys(EQ).map(function (k) {
      var n = D.equipment.filter(function (e) { return e.state === k; }).length;
      return '<span>' + EQ[k][0] + ' ' + n + '</span>';
    }).join('');
    $('eq').innerHTML = eqs.map(function (e) {
      var s = EQ[e.state] || [e.state, 'off'];
      return '<div class="eq" data-state="' + K.esc(e.state) + '" title="' + K.esc(e.note || s[0]) + '"><span class="id">' + K.esc(e.id) +
        '</span><span class="name">' + K.esc(e.name) + '</span><span class="st"><span>' + s[0] + '</span><span class="num">' + K.fmt(e.util) + '%</span></span>' +
        '<div class="progress ' + (s[1] === 'bad' ? 'bad' : (s[1] === 'warn' ? 'warn' : '')) + '"><i style="width:' + Math.max(0, Math.min(100, e.util)) + '%"></i></div></div>';
    }).join('') || empty('조건에 맞는 설비가 없습니다', '검색어나 공정 필터를 지워 보세요.');
    $('lot-count').textContent = lots.length + '건 / 전체 ' + D.lots.length + '건';
    $('lots').innerHTML = lots.map(function (l) {
      var s = LOT[l.state] || [l.state, 'off'];
      return '<tr class="' + (l.state === 'HOLD' ? 'row-bad' : '') + '"><td class="id">' + K.esc(l.lot) + '</td><td>' + K.esc(l.product) +
        '</td><td>' + K.esc(l.step) + '</td><td class="id">' + K.esc(l.eqp) + '</td><td class="num">' + K.fmt(l.qty) + '</td><td class="num">' +
        K.hhmm(l.start) + '</td><td>' + K.badge(s[0], s[1]) + '</td><td>' + (l.hold ? K.esc(l.hold) : '<span class="muted">-</span>') + '</td></tr>';
    }).join('') || '<tr><td colspan="8">' + empty('조건에 맞는 로트가 없습니다', '보기를 전체로 바꾸거나 필터를 지워 보세요.') + '</td></tr>';
  }
  function renderCharts() {
    var c = D.spc, lo = Math.min(c.lcl, c.ucl), hi = Math.max(c.lcl, c.ucl);
    var ooc = c.points.filter(function (v) { return v < lo || v > hi; }).length;
    $('h-spc').textContent = 'SPC 추세: ' + c.param;
    $('spc-meta').textContent = 'UCL ' + c.ucl + ' / 목표 ' + c.target + ' / LCL ' + c.lcl + ' ' + c.unit;
    $('spc').innerHTML = K.spark(c.points, { limits: [c.lcl, c.ucl], target: c.target, lg: true, label: c.param + ' 관리도' }) +
      '<div class="row between meta"><span>' + K.esc(c.labels[0] || '') + '</span><span>관리 이탈 ' + ooc + '점</span><span>' +
      K.esc(c.labels[c.labels.length - 1] || '') + '</span></div>';
    var by = {};
    D.equipment.forEach(function (e) { (by[e.step] = by[e.step] || []).push(e.util); });
    var rows = Object.keys(by).map(function (k) {
      var avg = by[k].reduce(function (a, b) { return a + b; }, 0) / by[k].length;
      return [k, Math.round(avg), avg < 50 ? 'bad' : (avg < 70 ? 'warn' : '')];
    });
    $('util').innerHTML = rows.length ? K.hbar(rows, { max: 100, unit: '%', target: 85 }) : empty('설비 데이터가 없습니다', '');
  }
  function failed(msg) {
    K.setStatus($('status'), 'failed', msg + '. 서버 경로와 data.json 형식을 확인한 뒤 새로고침을 누르세요.');
    ['stats', 'eq', 'alarms', 'spc', 'util'].forEach(function (id) { $(id).innerHTML = empty('표시할 데이터가 없습니다', ''); });
    $('lots').innerHTML = '<tr><td colspan="8">' + empty('표시할 데이터가 없습니다', '') + '</td></tr>';
  }
  function boot() {
    K.load('../data.json', SAMPLE).then(function (r) {
      if (!r.data) { failed(r.error); return; }
      D = r.data;
      var m = D.meta || {};
      K.setStatus($('status'), r.state, r.state === 'ok' ? 'data.json 기준 ' + K.hhmm(m.asof) : r.error + '. data.json 을 읽지 못해 내장 샘플을 보여줍니다.');
      $('line-name').textContent = m.line || '-';
      $('asof').textContent = '기준 ' + K.hhmm(m.asof);
      $('shift').textContent = m.shift || '';
      $('note').textContent = m.note || '';
      var cur = $('f-step').value, steps = [];
      D.equipment.forEach(function (e) { if (steps.indexOf(e.step) < 0) steps.push(e.step); });
      $('f-step').innerHTML = '<option value="">공정 전체</option>' + steps.map(function (s) { return '<option>' + K.esc(s) + '</option>'; }).join('');
      $('f-step').value = cur;
      renderStats(); renderAlarms(); renderCharts(); render();
    });
  }
  $('q').addEventListener('input', function () { if (D) render(); });
  $('f-step').addEventListener('change', function () { if (D) render(); });
  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]');
    if (!b || !D) return;
    view = b.getAttribute('data-view');
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });
  $('alarms').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ack]');
    if (!b) return;
    var a = D.alarms[+b.getAttribute('data-ack')], now = new Date();
    a.ack = true; a.ack_by = '나'; a.ack_at = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
    renderAlarms();
    K.toast(a.id + ' 확인 처리');
  });
  $('reload').addEventListener('click', boot);
  boot();
})();
</script>
</body>
</html>
