<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>설비 점검</title>
<!-- 템플릿 mobile (현장 작업자 앱): 큰 숫자 1 + 행동 1(전폭 CTA) + 56px 행 + 하단 탭 + 바텀시트. 표·다열 그리드 없음.
 390 +--------------------------------+
     | 설비 점검              [종 2]  |  appbar(고정)
     | [배너: 실데이터/샘플/실패]      |
     | 오늘 남은 점검                 |
     | 3 건    다음 09:30 ETC-03      |  큰 숫자 1개
     | [       다음 점검 시작       ]  |  전폭 CTA 48px, 누르면 바텀시트 체크리스트
     | [긴급] 고장 원인 1차 점검 09:30 |  56px 행(누르면 같은 시트)
     | [PM]   PM 완료 확인 서명  12:00 |
     | [오늘]   [점검]   [알림]        |  하단 탭(safe-area, 같은 페이지 안 이동)
 1280: 가운데 480px 한 열 그대로(데스크톱 전용 배치 없음)
  834: 가운데 480px 한 열(데스크톱과 같음)
  매핑: data.json 의 mobile.tasks / mobile.checklist / mobile.equipment_options / alarms. 저장은 이 화면 안에서만(서버 호출은 save 함수에 넣는다). -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components.css">
<style>
  .big h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  section[id] { scroll-margin-top: 64px; }
  .tasks { padding: 0; overflow: hidden; }
  .rows .r .t { white-space: normal; }
  .rows .r .due { display: flex; align-items: center; gap: 2px; color: var(--muted); font-size: 13px; }
  .rows .r.done { opacity: .55; }
  .sheet h2 { margin-bottom: var(--s-3); }
  .appbar .btn { gap: 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <h1 id="title">설비 점검</h1>
    <a class="btn ghost sm" href="#alarms" aria-label="알림 보기"><svg class="ico" aria-hidden="true"><use href="../icons.svg#i-bell"/></svg><span id="n-alarm">0</span></a>
  </header>
  <main>
    <div class="banner" id="status" hidden></div>
    <section class="big" id="today" aria-labelledby="h-today">
      <h2 id="h-today">오늘 남은 점검</h2>
      <div class="value"><span id="left">-</span><small>건</small></div>
      <span class="meta" id="next">-</span>
    </section>
    <button class="btn brand wide" type="button" id="start">다음 점검 시작</button>
    <section id="tasks" aria-labelledby="h-tasks">
      <h2 id="h-tasks">점검 목록</h2>
      <div class="card tasks"><div class="rows tall" id="list"></div></div>
    </section>
    <section id="alarms" aria-labelledby="h-alarms">
      <h2 id="h-alarms">알림</h2>
      <div class="alarm-list" id="alarm-list"></div>
    </section>
  </main>
  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="#today" class="on" aria-current="page"><svg class="ico" aria-hidden="true"><use href="../icons.svg#i-home"/></svg>오늘</a>
    <a href="#tasks"><svg class="ico" aria-hidden="true"><use href="../icons.svg#i-list"/></svg>점검</a>
    <a href="#alarms"><svg class="ico" aria-hidden="true"><use href="../icons.svg#i-bell"/></svg>알림</a>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="h-sheet" hidden>
    <div class="grip"></div>
    <h2 id="h-sheet">점검 체크리스트</h2>
    <form class="form" id="form" novalidate>
      <div class="field"><label for="eqp">설비</label><select id="eqp"></select></div>
      <div class="stack tight" id="checks"></div>
      <div class="field"><label for="memo">메모</label><textarea id="memo" placeholder="이상이 있으면 적습니다"></textarea></div>
      <div class="field"><p class="error" id="form-error" role="alert" hidden></p></div>
      <button class="btn brand wide" type="submit">점검 완료 저장</button>
      <button class="btn ghost wide" type="button" id="cancel">닫기</button>
    </form>
  </section>
</div>

<script src="../kit.js"></script>
<script>
(function () {
  'use strict';
  var SAMPLE = {
    meta: { asof: '2026-01-01T09:00' },
    mobile: { title: '설비 점검', equipment_options: ['EQ-01'], checklist: [{ id: 'c1', label: '샘플 확인 항목' }],
      tasks: [{ id: 'T-S01', eqp: 'EQ-01', title: '샘플 점검', due: '10:00', state: 'info', state_label: '일반' }] },
    alarms: []
  };
  var SEV = { Critical: ['긴급', 'bad'], Major: ['주의', 'warn'], Minor: ['정보', 'info'] };
  var $ = function (id) { return document.getElementById(id); };
  var M = null, A = [], cur = null;

  function empty(title, hint) { return '<div class="empty"><b>' + K.esc(title) + '</b>' + K.esc(hint || '') + '</div>'; }
  function open() { return M.tasks.filter(function (t) { return !t.done; }).sort(function (a, b) { return a.due < b.due ? -1 : 1; }); }
  function render() {
    var left = open(), nx = left[0];
    $('left').textContent = left.length;
    $('next').textContent = nx ? '다음 ' + nx.due + ' ' + nx.eqp + ' ' + nx.title : '오늘 점검을 모두 마쳤습니다';
    $('start').disabled = !nx;
    $('start').textContent = nx ? '다음 점검 시작' : '오늘 점검 완료';
    $('list').innerHTML = M.tasks.map(function (t, i) {
      return '<button type="button" class="r' + (t.done ? ' done' : '') + '" data-i="' + i + '">' + K.badge(t.done ? '완료' : t.state_label, t.done ? 'off' : t.state) +
        '<span><span class="t">' + K.esc(t.title) + '</span><br><span class="s id">' + K.esc(t.eqp) + '</span></span>' +
        '<span class="due num">' + K.esc(t.due) + '<svg class="ico sm" aria-hidden="true"><use href="../icons.svg#i-chevron-right"/></svg></span></button>';
    }).join('') || empty('오늘 배정된 점검이 없습니다', '새 점검이 배정되면 여기에 나옵니다.');
    var unacked = A.filter(function (a) { return !a.ack; });
    $('n-alarm').textContent = unacked.length;
    $('alarm-list').innerHTML = unacked.map(function (a) {
      var s = SEV[a.sev] || [a.sev, 'info'];
      return '<div class="alarm"><span class="sev ' + s[1] + '"></span>' + K.badge(s[0], s[1]) + '<span class="msg">' + K.esc(a.eqp) + ' ' + K.esc(a.msg) +
        '</span><span class="when">' + K.hhmm(a.at) + '</span></div>';
    }).join('') || empty('새 알림이 없습니다', '');
  }
  function openSheet(task) {
    cur = task;
    $('eqp').innerHTML = M.equipment_options.map(function (e) { return '<option' + (task && task.eqp === e ? ' selected' : '') + '>' + K.esc(e) + '</option>'; }).join('');
    $('checks').innerHTML = M.checklist.map(function (c) {
      return '<label class="check"><input type="checkbox" name="c" value="' + K.esc(c.id) + '"><span>' + K.esc(c.label) + '</span></label>';
    }).join('');
    $('memo').value = '';
    $('form-error').hidden = true;
    $('sheet').hidden = false; $('scrim').hidden = false;
    $('h-sheet').textContent = task ? task.eqp + ' ' + task.title : '점검 체크리스트';
    $('h-sheet').setAttribute('tabindex', '-1'); $('h-sheet').focus();
  }
  function closeSheet() { $('sheet').hidden = true; $('scrim').hidden = true; $('start').focus(); }
  function save(task) { task.done = true; }   // 서버가 있으면 여기서 POST 하고 실패 시 배너로 알린다
  function boot() {
    K.load('../data.json', SAMPLE).then(function (r) {
      if (!r.data || !r.data.mobile) {
        K.setStatus($('status'), 'failed', (r.error || 'mobile 항목 없음') + '. 서버 경로와 data.json 형식을 확인하세요.');
        $('list').innerHTML = empty('점검 목록을 불러오지 못했습니다', '잠시 뒤 다시 열어 주세요.');
        $('start').disabled = true;
        return;
      }
      M = r.data.mobile; A = r.data.alarms || [];
      $('title').textContent = M.title || '설비 점검';
      K.setStatus($('status'), r.state, r.state === 'ok' ? '기준 ' + K.hhmm((r.data.meta || {}).asof) : r.error + '. 내장 샘플을 보여줍니다.');
      render();
    });
  }
  $('start').addEventListener('click', function () { if (M) openSheet(open()[0]); });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) openSheet(M.tasks[+b.getAttribute('data-i')]);
  });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var miss = this.querySelectorAll('input[name="c"]:not(:checked)').length;
    if (miss) { $('form-error').textContent = '확인하지 않은 항목이 ' + miss + '개 있습니다'; $('form-error').hidden = false; return; }
    var task = cur || M.tasks.filter(function (t) { return t.eqp === $('eqp').value && !t.done; })[0];
    if (task) save(task);
    closeSheet(); render();
    K.toast($('eqp').value + ' 점검 완료 저장');
  });
  $('cancel').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  document.querySelector('.tabbar').addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    this.querySelectorAll('a').forEach(function (x) { x.classList.toggle('on', x === a); if (x === a) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
  });
  boot();
})();
</script>
</body>
</html>
